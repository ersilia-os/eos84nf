Status: Ready
Title: GenMol Superstructure Generation
Description: Grows an input molecule into up to 100 larger drug-like molecules, each
  containing the whole input. GenMol, from NVIDIA, applies masked discrete diffusion
  over the SAFE fragment representation, revealing fragment blocks in parallel
  rather than emitting a string token by token, which beats the earlier
  autoregressive SAFE-GPT on validity, molecular quality and diversity while
  sampling faster. Training used the SAFE corpus built from ZINC and UniChem.
  Sampling is stochastic and unseeded, and duplicates or copies of the input are
  discarded, so fewer than 100 molecules often come back.
