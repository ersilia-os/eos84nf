Status: Ready
Title: GenMol Scaffold Decoration
Description: Elaborates a scaffold carrying attachment points into up to 100 new drug-like
  molecules. GenMol, from NVIDIA, applies masked discrete diffusion over the SAFE
  fragment representation, revealing fragment blocks in parallel rather than emitting
  a string token by token, which beats the earlier autoregressive SAFE-GPT on validity,
  molecular quality and diversity while sampling faster. Training used the SAFE corpus
  built from ZINC and UniChem. Sampling is stochastic and unseeded, and duplicates
  or copies of the input are discarded, so fewer than 100 molecules often come back.
