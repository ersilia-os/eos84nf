Status: Ready
Title: GenMol Superstructure Generation
Description: Grows an input molecule into up to 100 larger drug-like molecules, 
  each containing the whole input. GenMol, from NVIDIA, applies masked discrete 
  diffusion over the SAFE fragment representation, revealing fragment blocks in 
  parallel rather than token by token, beating the autoregressive SAFE-GPT on 
  validity, quality and diversity. Trained on the SAFE corpus from ZINC and 
  UniChem. Sampling is stochastic and unseeded. GenMol is called up to five 
  times with new attachment points, dropping duplicates and copies of the input,
  until 100 molecules are collected.
