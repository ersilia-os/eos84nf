Identifier: eos84nf
Slug: genmol-scaffold-decoration
Status: In progress
Title: GenMol Scaffold Decoration
Description: Given a scaffold molecule with attachment points, generates new 
  drug-like molecules by decorating it with novel side fragments, using masked 
  discrete diffusion over a fragment-based (SAFE) molecular representation. 
  Trained on ZINC and UniChem data, it outperforms the earlier autoregressive 
  SAFE-GPT model on validity, molecular quality, and diversity, while sampling 
  substantially faster via non-autoregressive parallel decoding — useful for 
  exploring synthesizable, chemically valid analogues around a known scaffold 
  during hit-to-lead optimization.
